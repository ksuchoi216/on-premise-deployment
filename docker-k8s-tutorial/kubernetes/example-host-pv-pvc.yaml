# 퍼시스턴트볼륨 정의
apiVersion: v1
kind: PersistentVolume
metadata:
  name: example-pv
spec:
  capacity:
    storage: 5G		# 스토리지 용량
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: "/tmp"
---
# 퍼시스턴트볼륨클레임 정의
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example-pvc
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5G		# 스토리지 요청 용량
